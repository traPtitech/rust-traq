[package]
name = "traq"
version = "0.2.0"
authors = ["OpenAPI Generator team and contributors", "H1rono"]
description = "⚠️ Community Driven ⚠️ traQ v3 API"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/traPtitech/rust-traq"
documentation = "https://github.com/traPtitech/rust-traq/tree/main/docs"
keywords = ["traq", "openapi"]
edition = "2021"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

[dependencies]
chrono = { version = "^0.4", features = ["serde"] }
serde = { version = "^1.0", features = ["derive"] }
serde_derive = "^1.0"
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.0", features = ["serde"] }
tokio = { version = "^1.46", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }

[dependencies.reqwest]
version = "^0.13"
default-features = false
features = ["json", "multipart", "stream", "query", "form", "charset", "http2", "system-proxy"]
